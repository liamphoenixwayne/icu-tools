{id:"gcs",title:"Glasgow Coma Scale (GCS) · GCS-P · FOUR",
desc:"意识水平评估。GCS 总分 3–15；插管患者语言记为 VT（如 E3VTM6）。",

["6","—","—","遵嘱动作 obeys commands"],["5","—","定向正常 oriented","定位疼痛 localising"],["4","自发 spontaneous","言语混乱 confused","正常屈曲/回缩 normal flexion"],
["3","声音刺激 to sound","不恰当词语 words","异常屈曲(去皮层) abnormal flexion"],["2","压力刺激 to pressure","仅发声 sounds","伸展(去大脑) extension"],["1","无","无","无"]]},
{cap:"FOUR score（每项 0–4，总分 0–16；可评估插管患者及脑干功能）",head:["分","Eye","Motor","Brainstem","Respiration"],rows:[
["4","睁眼并追踪/遵嘱眨眼","竖拇指/握拳/V 手势","瞳孔+角膜反射存在","未插管，呼吸规则"],["3","睁眼不追踪","定位疼痛","一侧瞳孔散大固定","未插管，潮式呼吸"],
["2","闭眼，大声呼唤睁眼","疼痛屈曲","瞳孔或角膜反射消失","未插管，呼吸不规则"],["1","闭眼，疼痛刺激睁眼","疼痛伸展","瞳孔和角膜反射均消失","呼吸频率高于呼吸机"],
["0","疼痛刺激仍闭眼","无反应/全身肌阵挛状态","瞳孔、角膜、咳嗽反射均消失","等于呼吸机频率或呼吸暂停"]]}],
notes:["<b>≤8</b> 昏迷 → 评估气道保护；TBI 分级：13–15 轻 / 9–12 中 / 3–8 重","<b>GCS-P</b> = GCS − 无反应瞳孔数（0/1/2），范围 1–15","报告时写分项（E/V/M）比总分更有信息量，M 分预后价值最大"],
refs:"Teasdale G, Lancet 1974 · Teasdale G, Lancet Neurol 2014 · Brennan PM, J Neurosurg 2018 · Wijdicks EF, Ann Neurol 2005",
tests:["test_gcs_range_3_15","test_intubated_returns_VT_notation","test_gcs_p_min_is_1","test_four_score_bounds","test_airway_flag_le_8"],
demo:["GCS(e=2, v=2, m=4) → <span class='wh'>8</span>  airway_flag=<span class='er'>True</span>","GCS(e=3, v=None, m=6) → <span class='wh'>E3VTM6</span>","gcs_p(8, pupils_unreactive=1) → <span class='wh'>7</span>","four_score(e=1, m=2, b=2, r=1) → <span class='wh'>6</span>"],
code:`"""Glasgow Coma Scale (Teasdale 2014 terminology) + GCS-P + FOUR score."""
from dataclasses import dataclass

EYE = {4: "spontaneous", 3: "to sound", 2: "to pressure", 1: "none"}
VERBAL = {5: "oriented", 4: "confused", 3: "words", 2: "sounds", 1: "none"}
MOTOR = {6: "obeys commands", 5: "localising", 4: "normal flexion",
         3: "abnormal flexion", 2: "extension", 1: "none"}

@dataclass
class GCS:
    e: int
    v: int | None   # None = intubated / not testable -> "VT"
    m: int

    def total(self) -> str:
        if self.v is None:
            return f"E{self.e}VTM{self.m}"
        return str(self.e + self.v + self.m)

def gcs_p(gcs_total: int, pupils_unreactive: int) -> int:
    """GCS-Pupils: subtract number of non-reactive pupils (0/1/2), range 1-15."""
    assert pupils_unreactive in (0, 1, 2)
    return gcs_total - pupils_unreactive

def four_score(e: int, m: int, b: int, r: int) -> int:
    """FOUR: Eye, Motor, Brainstem, Respiration, each 0-4 (total 0-16)."""
    assert all(0 <= x <= 4 for x in (e, m, b, r))
    return e + m + b + r

def airway_flag(g: GCS) -> bool:
    return g.v is not None and int(g.total()) <= 8`},

["CNS GCS","15","13–14","10–12","6–9","<6"],["肾 Cr µmol/L / 尿量","<110","110–170","171–299","300–440 或 UO <500 mL/d",">440 或 UO <200 mL/d"]]},
{cap:"qSOFA（每项 1 分，≥2 阳性）",head:["指标","标准"],rows:[["呼吸频率","≥22 次/分"],["意识改变","GCS <15"],["收缩压","≤100 mmHg"]]}],
notes:["<b>Sepsis</b> = 感染 + ΔSOFA ≥2（院内死亡率 >10%）","<b>Septic shock</b> = 充分液体复苏后仍需血管活性药维持 MAP ≥65 mmHg 且 Lactate >2 mmol/L（死亡率 >40%）","SSC 2021：不推荐单独使用 qSOFA 作为脓毒症筛查工具（与 SIRS/NEWS/MEWS 相比）","本表为经典 SOFA（SOFA-1）；2025 年新版见 <code>sofa2.md</code>（Ranzani, JAMA 2025）"],
refs:"Vincent JL, Intensive Care Med 1996 · Singer M, JAMA 2016 · Evans L, Crit Care Med 2021 (SSC) · Ranzani OT, JAMA 2025",
tests:["test_resp_requires_vent_for_3_4","test_coag_bands","test_liver_umol_cutoffs","test_cv_norepi_gt_0_1_is_4","test_renal_uo_overrides","test_qsofa_max_3","test_septic_shock_definition"],
demo:["P/F 180 vent R<span class='wh'>3</span> · PLT 85 C<span class='wh'>2</span> · TBil 40 L<span class='wh'>2</span> · NE 0.15 CV<span class='wh'>4</span> · GCS 13 N<span class='wh'>1</span> · Cr 190 K<span class='wh'>2</span>","SOFA = <span class='wh'>14</span>  baseline 2 → ΔSOFA 12 → <span class='er'>Sepsis-3 ✓</span>","qsofa(rr=26, sbp=92, gcs=13) → <span class='wh'>3</span>","septic_shock(needs_pressor=True, lactate=4.1) → <span class='er'>True</span>"],
code:`"""SOFA (Vincent 1996) + qSOFA; Sepsis-3 definitions (Singer, JAMA 2016)."""

def _band(x: float, cuts: list[float]) -> int:
    """ascending thresholds -> 0..len(cuts) points"""
    return sum(x >= c for c in cuts)

def sofa_resp(pf: float, resp_support: bool) -> int:
    if pf < 100 and resp_support: return 4
    if pf < 200 and resp_support: return 3
    if pf < 300: return 2
    return 1 if pf < 400 else 0

def sofa_coag(plt: float) -> int:          # x10^9/L
    return 4 if plt < 20 else 3 if plt < 50 else 2 if plt < 100 else 1 if plt < 150 else 0

def sofa_liver(bili_umol: float) -> int:
    return _band(bili_umol, [20, 33, 102, 205])

def sofa_cv(map_mmhg, ne=0.0, epi=0.0, dopa=0.0, dobu=0.0) -> int:   # mcg/kg/min
    if dopa > 15 or epi > 0.1 or ne > 0.1: return 4
    if dopa > 5 or epi > 0 or ne > 0: return 3
    if dopa > 0 or dobu > 0: return 2
    return 1 if map_mmhg < 70 else 0

def sofa_cns(gcs: int) -> int:
    return 0 if gcs == 15 else 1 if gcs >= 13 else 2 if gcs >= 10 else 3 if gcs >= 6 else 4

def sofa_renal(cr_umol: float, uo_ml_day: float | None = None) -> int:
    pts = _band(cr_umol, [110, 171, 300, 441])
    if uo_ml_day is not None:
        pts = max(pts, 4 if uo_ml_day < 200 else 3 if uo_ml_day < 500 else 0)
    return pts

def qsofa(rr: int, sbp: int, gcs: int) -> int:
    return (rr >= 22) + (sbp <= 100) + (gcs < 15)

def septic_shock(needs_pressor_for_map65: bool, lactate: float) -> bool:
    return needs_pressor_for_map65 and lactate > 2.0`},

code:`"""SOFA-2 (Ranzani, JAMA 2025). Max points per system within 24 h; total 0-24."""

ADV_SUPPORT = {"HFNC", "CPAP", "BiPAP", "NIV", "IMV", "home_vent"}

def brain(gcs: int | None, delirium_drugs: bool = False) -> int:
    """Sedated: last GCS before sedation (unknown -> 0). E/V not testable: best motor."""
    if gcs is None:
        return 0
    pts = 0 if gcs == 15 else 1 if gcs >= 13 else 2 if gcs >= 9 else 3 if gcs >= 6 else 4
    return max(pts, 1) if delirium_drugs else pts

def respiratory(pf=None, sf=None, spo2=None, support=None, ecmo_resp=False,
                support_unavailable=False) -> int:
    if ecmo_resp:
        return 4
    adv = support in ADV_SUPPORT or support_unavailable
    if pf is not None:
        ratio, cuts = pf, [(75, 4), (150, 3), (225, 2), (300, 1)]
    elif sf is not None and spo2 is not None and spo2 < 98:
        ratio, cuts = sf, [(120, 4), (200, 3), (250, 2), (300, 1)]
    else:
        return 0
    for thr, pts in cuts:
        if ratio <= thr and (pts < 3 or adv):    # 3-4 points need advanced support
            return pts
    return 0

def cardiovascular(map_mmhg, ne_epi=0.0, other_pressor=False, mech_support=False,
                   dopamine_only=None, drugs_unavailable=False) -> int:
    """ne_epi: norepinephrine (as base) + epinephrine, mcg/kg/min, infusion >= 1 h"""
    if drugs_unavailable:                         # ceiling of treatment: MAP only
        return 0 if map_mmhg >= 70 else 1 if map_mmhg >= 60 else 2 if map_mmhg >= 50 else 3 if map_mmhg >= 40 else 4
    if dopamine_only is not None:
        return 2 if dopamine_only <= 20 else 3 if dopamine_only <= 40 else 4
    if mech_support or ne_epi > 0.4:
        return 4
    if ne_epi > 0.2:
        return 4 if other_pressor else 3
    if ne_epi > 0:
        return 3 if other_pressor else 2
    if other_pressor:
        return 2
    return 0 if map_mmhg >= 70 else 1

def liver(bili_umol: float) -> int:
    return 0 if bili_umol <= 20.6 else 1 if bili_umol <= 51.3 else 2 if bili_umol <= 102.6 else 3 if bili_umol <= 205 else 4

def meets_rrt_criteria(cr_umol, uo_lt03_h, k, ph, hco3) -> bool:
    renal = cr_umol > 110 or uo_lt03_h > 6
    return renal and (k >= 6.0 or (ph <= 7.20 and hco3 <= 12))

def kidney(cr_umol, uo_lt05_h=0, uo_lt03_h=0, anuria_h=0, rrt=False, rrt_criteria=False) -> int:
    if rrt or rrt_criteria:
        return 4
    if cr_umol > 300 or uo_lt03_h >= 24 or anuria_h >= 12:
        return 3
    if cr_umol > 170 or uo_lt05_h >= 12:
        return 2
    return 1 if cr_umol > 110 or uo_lt05_h >= 6 else 0

def hemostasis(plt: float) -> int:
    return 0 if plt > 150 else 1 if plt > 100 else 2 if plt > 80 else 3 if plt > 50 else 4`},

code:`"""APACHE II (Knaus, Crit Care Med 1985) - worst values in the first 24 h."""
# ordered (threshold, points): first threshold with x >= thr wins; None = floor
APS = {
    "temp":  [(41, 4), (39, 3), (38.5, 1), (36, 0), (34, 1), (32, 2), (30, 3), (None, 4)],
    "map":   [(160, 4), (130, 3), (110, 2), (70, 0), (50, 2), (None, 4)],
    "hr":    [(180, 4), (140, 3), (110, 2), (70, 0), (55, 2), (40, 3), (None, 4)],
    "rr":    [(50, 4), (35, 3), (25, 1), (12, 0), (10, 1), (6, 2), (None, 4)],
    "ph":    [(7.7, 4), (7.6, 3), (7.5, 1), (7.33, 0), (7.25, 2), (7.15, 3), (None, 4)],
    "na":    [(180, 4), (160, 3), (155, 2), (150, 1), (130, 0), (120, 2), (111, 3), (None, 4)],
    "k":     [(7, 4), (6, 3), (5.5, 1), (3.5, 0), (3, 1), (2.5, 2), (None, 4)],
    "cr_mg": [(3.5, 4), (2, 3), (1.5, 2), (0.6, 0), (None, 2)],
    "hct":   [(60, 4), (50, 2), (46, 1), (30, 0), (20, 2), (None, 4)],
    "wbc":   [(40, 4), (20, 2), (15, 1), (3, 0), (1, 2), (None, 4)],
}

def band(var: str, x: float) -> int:
    for thr, pts in APS[var]:
        if thr is None or x >= thr:
            return pts

def oxygenation(fio2: float, pao2: float, aado2: float) -> int:
    if fio2 >= 0.5:
        return 4 if aado2 >= 500 else 3 if aado2 >= 350 else 2 if aado2 >= 200 else 0
    return 0 if pao2 > 70 else 1 if pao2 >= 61 else 3 if pao2 >= 55 else 4

def age_points(age: int) -> int:
    return 0 if age <= 44 else 2 if age <= 54 else 3 if age <= 64 else 5 if age <= 74 else 6

def apache2(v: dict, gcs: int, age: int, chronic: str | None = None, arf=False) -> int:
    aps = sum(band(k, v[k]) for k in APS)
    if arf:
        aps += band("cr_mg", v["cr_mg"])          # creatinine points doubled in ARF
    aps += oxygenation(v["fio2"], v["pao2"], v["aado2"]) + (15 - gcs)
    chp = {"nonop": 5, "emergency": 5, "elective": 2}.get(chronic, 0)
    return aps + age_points(age) + chp`},

code:`"""Child-Turcotte-Pugh (Pugh, Br J Surg 1973) + West Haven HE grading."""

WEST_HAVEN = {
    0: "no abnormality / minimal HE (psychometric tests only)",
    1: "trivial lack of awareness, shortened attention span",
    2: "lethargy, disorientation to time, asterixis",
    3: "somnolence to semi-stupor, gross disorientation",
    4: "coma",
}

def _pts(x: float, lo: float, hi: float, reverse: bool = False) -> int:
    if reverse:                       # lower is worse (albumin)
        return 1 if x > lo else 2 if x >= hi else 3
    return 1 if x < lo else 2 if x <= hi else 3

def child_pugh(bili_umol, alb_g_l, inr, ascites: int, he_grade: int, cholestatic=False):
    """ascites: 0 none / 1 mild-controlled / 2 moderate-severe; he_grade: West Haven 0-4"""
    b_lo, b_hi = (68, 170) if cholestatic else (34, 50)
    s = (_pts(bili_umol, b_lo, b_hi)
         + _pts(alb_g_l, 35, 28, reverse=True)
         + _pts(inr, 1.7, 2.3)
         + (1 + min(ascites, 2))
         + (1 if he_grade == 0 else 2 if he_grade <= 2 else 3))
    cls = "A" if s <= 6 else "B" if s <= 9 else "C"
    return s, cls`},

demo:["TBil 4.2  INR 2.1  Cr 1.8  Na 128  Alb 2.6  female","meld → <span class='wh'>26</span>   meld_na → <span class='wh'>30</span>   meld3 → <span class='wh'>32</span>"],
code:`"""MELD (Kamath 2001), MELD-Na (Kim, NEJM 2008), MELD 3.0 (Kim, Gastroenterology 2021).
Units: bilirubin & creatinine mg/dL, albumin g/dL."""
from math import log

def _clip(x: float, lo: float, hi: float) -> float:
    return max(lo, min(hi, x))

def meld(bili, inr, cr, dialysis=False) -> int:
    cr = 4.0 if dialysis else _clip(cr, 1.0, 4.0)
    bili, inr = max(bili, 1.0), max(inr, 1.0)
    m = 10 * (0.957 * log(cr) + 0.378 * log(bili) + 1.120 * log(inr) + 0.643)
    return min(round(m), 40)

def meld_na(bili, inr, cr, na, dialysis=False) -> int:
    m = meld(bili, inr, cr, dialysis)
    if m <= 11:
        return m
    na = _clip(na, 125, 137)
    return min(round(m + 1.32 * (137 - na) - 0.033 * m * (137 - na)), 40)

def meld3(bili, inr, cr, na, alb, female: bool, dialysis=False) -> int:
    bili, inr = max(bili, 1.0), max(inr, 1.0)
    cr = 3.0 if dialysis else _clip(cr, 1.0, 3.0)
    na, alb = _clip(na, 125, 137), _clip(alb, 1.5, 3.5)
    s = (1.33 * female + 4.56 * log(bili) + 0.82 * (137 - na)
         - 0.24 * (137 - na) * log(bili) + 9.09 * log(inr)
         + 11.14 * log(cr) + 1.85 * (3.5 - alb)
         - 1.83 * (3.5 - alb) * log(cr) + 6)
    return min(round(s), 40)`},

code:`"""Richmond Agitation-Sedation Scale (Sessler, AJRCCM 2002). PADIS 2018: light sedation."""

RASS = {
    +4: "Combative - violent, immediate danger to staff",
    +3: "Very agitated - pulls or removes tubes, aggressive",
    +2: "Agitated - frequent non-purposeful movement, fights ventilator",
    +1: "Restless - anxious, movements not aggressive",
     0: "Alert and calm",
    -1: "Drowsy - sustained awakening to voice, eye contact > 10 s",
    -2: "Light sedation - briefly awakens to voice, eye contact < 10 s",
    -3: "Moderate sedation - movement or eye opening to voice, no eye contact",
    -4: "Deep sedation - no response to voice, moves to physical stimulation",
    -5: "Unarousable - no response to voice or physical stimulation",
}

def target_range(goal: str = "light") -> tuple[int, int]:
    return (-2, 0) if goal == "light" else (-5, -4)   # deep: specific indications only

def sedation_flag(rass: int, goal: str = "light") -> str:
    lo, hi = target_range(goal)
    if rass > hi:
        return "UNDER_SEDATED - check pain / delirium first"
    if rass < lo:
        return "OVER_SEDATED -> consider SAT / reduce dose"
    return "AT_TARGET"

def cam_eligible(rass: int) -> bool:
    return rass >= -3`},

demo:["rass=-1  F1=True  SAVEAHAART errors=4  → F2 <span class='er'>+</span>  F3 <span class='er'>+</span>","cam_icu(...) → <span class='er'>CAM-ICU POSITIVE</span>"],
code:`"""CAM-ICU (Ely, JAMA 2001). Delirium = F1 + F2 + (F3 or F4). Requires RASS >= -3."""

LETTERS = "SAVEAHAART"          # patient squeezes hand on every 'A'
QUESTIONS = [
    ("Will a stone float on water?", False),
    ("Are there fish in the sea?", True),
    ("Does one pound weigh more than two pounds?", False),
    ("Can you use a hammer to pound a nail?", True),
]

def feature2_inattention(squeezes: list[bool]) -> bool:
    errors = sum(s != (ch == "A") for s, ch in zip(squeezes, LETTERS))
    return errors > 2

def feature4_disorganized(answers: list[bool], follows_command: bool) -> bool:
    errors = sum(a != q[1] for a, q in zip(answers, QUESTIONS)) + (not follows_command)
    return errors > 1

def cam_icu(rass: int, f1_acute_or_fluctuating: bool, squeezes, answers, follows_command) -> str:
    if rass < -3:
        return "UNABLE TO ASSESS (RASS -4/-5) - reassess later"
    f2 = feature2_inattention(squeezes)
    f3 = rass != 0
    f4 = feature4_disorganized(answers, follows_command)
    positive = f1_acute_or_fluctuating and f2 and (f3 or f4)
    return "CAM-ICU POSITIVE" if positive else "CAM-ICU NEGATIVE"`},

code:`"""Behavioural pain scales for non-communicative ICU patients (PADIS 2018)."""

CPOT = {   # Gelinas, Am J Crit Care 2006 - each 0-2, total 0-8

notes:["C = new Confusion（新发意识混乱）","只要有一个参数得 3 分就需要紧急评估"],
refs:"Royal College of Physicians. NEWS2, 2017",
tests:["news2 > healthy adult scores 0","news2 > any single red parameter → low-medium","news2 > on O2 adds 2","news2 > score ≥7 → high"],
demo:["RR 24(2) SpO₂ 93(2) O₂(2) SBP 98(2) HR 112(2) Alert(0) T 38.4(1)","news2(obs) → { score: <span class='wh'>11</span>, risk: <span class='er'>'high'</span> }"],
code:`// NEWS2 - Royal College of Physicians 2017. Ward deterioration -> ICU review trigger.
type Band = [number, number, number];   // [lo, hi, points]

const RR: Band[]     = [[0, 8, 3], [9, 11, 1], [12, 20, 0], [21, 24, 2], [25, 99, 3]];
const SPO2_1: Band[] = [[0, 91, 3], [92, 93, 2], [94, 95, 1], [96, 100, 0]];
const SBP: Band[]    = [[0, 90, 3], [91, 100, 2], [101, 110, 1], [111, 219, 0], [220, 999, 3]];
const HR: Band[]     = [[0, 40, 3], [41, 50, 1], [51, 90, 0], [91, 110, 1], [111, 130, 2], [131, 999, 3]];
const TEMP: Band[]   = [[0, 35.0, 3], [35.1, 36.0, 1], [36.1, 38.0, 0], [38.1, 39.0, 1], [39.1, 45, 2]];

const pts = (x: number, bands: Band[]): number =>
  bands.find(([lo, hi]) => x >= lo && x <= hi)?.[2] ?? 0;

export interface Obs {
  rr: number; spo2: number; onO2: boolean; sbp: number; hr: number; cvpu: boolean; temp: number;
}

export function news2(o: Obs): { score: number; risk: string } {
  const parts = [pts(o.rr, RR), pts(o.spo2, SPO2_1), o.onO2 ? 2 : 0, pts(o.sbp, SBP),
                 pts(o.hr, HR), o.cvpu ? 3 : 0, pts(Math.round(o.temp * 10) / 10, TEMP)];
  const score = parts.reduce((a, b) => a + b, 0);
  const red = parts.some((p) => p === 3);
  const risk = score >= 7 ? "high" : score >= 5 ? "medium" : red ? "low-medium" : "low";
  return { score, risk };
}`},

["3","3.0 × 基线 或 SCr ≥353.6 µmol/L (≥4.0 mg/dL) 或 开始 RRT 或 <18 岁 eGFR <35","<0.3 mL/kg/h × ≥24 h 或 无尿 ≥12 h"]]}],

refs:"KDIGO AKI Guideline, Kidney Int Suppl 2012 · Meersch M, Intensive Care Med 2017 (PrevAKI)",
tests:["test_ratio_1_5_is_stage1","test_absolute_rise_26_5_in_48h","test_cr_ge_353_6_is_stage3","test_rrt_is_stage3","test_uo_trailing_run","test_worse_of_cr_and_uo"],
demo:["baseline 80 µmol/L → Cr 172 (×2.15) → by_cr <span class='wh'>2</span>","UO <0.5 mL/kg/h for 8 h → by_uo <span class='wh'>1</span>","kdigo(...) → <span class='er'>Stage 2</span>"],
code:`"""KDIGO 2012 AKI staging - creatinine OR urine output, whichever is worse."""

def stage_by_cr(cr_umol, baseline_umol, rise_48h_umol=0.0, rrt=False) -> int:
    ratio = cr_umol / baseline_umol
    if rrt or ratio >= 3.0 or cr_umol >= 353.6:
        return 3
    if ratio >= 2.0:
        return 2
    if ratio >= 1.5 or rise_48h_umol >= 26.5:
        return 1
    return 0

def _trailing_hours_below(uo: list[float], threshold: float) -> int:
    n = 0
    for x in reversed(uo):              # hourly mL/kg/h, most recent last
        if x >= threshold:
            break
        n += 1
    return n

def stage_by_uo(uo_ml_kg_h: list[float]) -> int:
    if _trailing_hours_below(uo_ml_kg_h, 0.3) >= 24 or _trailing_hours_below(uo_ml_kg_h, 0.01) >= 12:
        return 3
    h = _trailing_hours_below(uo_ml_kg_h, 0.5)
    return 2 if h >= 12 else 1 if h >= 6 else 0

def kdigo(cr, baseline, uo, rise_48h=0.0, rrt=False) -> int:
    return max(stage_by_cr(cr, baseline, rise_48h, rrt), stage_by_uo(uo))`},

demo:["pbw(170, male) → <span class='wh'>66.0 kg</span> → Vt 6 mL/kg = <span class='wh'>396 mL</span>","berlin_severity(pf=140, peep=10) → <span class='wr'>'moderate'</span>","pplat 27, peep 10 → ΔP 17 → driving_pressure_ok=<span class='er'>False</span>"],
code:`"""ARDS: Berlin (JAMA 2012) + Global definition (Matthay, AJRCCM 2024) + ARDSNet ventilation."""

def pbw(height_cm: float, male: bool) -> float:
    return (50.0 if male else 45.5) + 0.91 * (height_cm - 152.4)

def berlin_severity(pf: float, peep: float) -> str | None:
    if peep < 5:
        return None
    return "severe" if pf <= 100 else "moderate" if pf <= 200 else "mild" if pf <= 300 else None

def global_severity_sf(sf: float, spo2: float) -> str | None:
    if spo2 > 97:                       # S/F unreliable on flat part of ODC
        return None
    return "severe" if sf <= 148 else "moderate" if sf <= 235 else "mild" if sf <= 315 else None

def global_nonintubated(pf=None, sf=None, hfno_lpm=0, niv_peep=0) -> bool:
    supported = hfno_lpm >= 30 or niv_peep >= 5
    hypox = (pf is not None and pf <= 300) or (sf is not None and sf <= 315)
    return supported and hypox

# ARDSNet lower PEEP / higher FiO2 table
LOW_PEEP = [(0.3, 5), (0.4, 5), (0.4, 8), (0.5, 8), (0.5, 10), (0.6, 10), (0.7, 10),
            (0.7, 12), (0.7, 14), (0.8, 14), (0.9, 14), (0.9, 16), (0.9, 18),
            (1.0, 18), (1.0, 20), (1.0, 22), (1.0, 24)]

def lung_protective(height_cm, male, pplat, peep) -> dict:
    dp = pplat - peep
    return {"vt_ml": round(pbw(height_cm, male) * 6),
            "pplat_ok": pplat <= 30,
            "driving_pressure_ok": dp < 15}`},

desc:"ISTH 评分 ≥5 = 显性 DIC；SIC 用于脓毒症早期凝血障碍识别（更早、更敏感）。",
tables:[{cap:"ISTH overt DIC（需存在可致 DIC 的基础疾病）",head:["指标","0","1","2","3"],rows:[["PLT ×10⁹/L","≥100","50–<100","<50",""],["D-dimer / FDP","不升高","","中度升高","显著升高"],["PT 延长","<3 s","3–<6 s","≥6 s",""],["纤维蛋白原","≥1.0 g/L","<1.0 g/L","",""]]},
{cap:"SIC（总分 ≥4 且 PT+PLT 两项之和 >2）",head:["指标","0","1","2"],rows:[["PT-INR","≤1.2",">1.2",">1.4"],["PLT ×10⁹/L","≥150","100–<150","<100"],["SOFA（呼吸+循环+肝+肾 之和）","0","1","≥2"]]}],
notes:["D-dimer 的“中度/显著”阈值依各实验室而定","ISTH 2019 指南推荐两步法：先 SIC 筛查，再 ISTH overt DIC"],
refs:"Taylor FB, Thromb Haemost 2001 · Iba T, BMJ Open 2017 · Iba T, J Thromb Haemost 2019",
tests:["test_isth_plt_bands","test_isth_ddimer_levels","test_isth_cutoff_ge_5","test_sic_sofa4_capped_2","test_sic_requires_coag_gt_2"],
demo:["PLT 62(1) D-dimer strong(3) PT +4.5 s(1) Fib 0.9(1) → ISTH <span class='wh'>6</span> → <span class='er'>overt DIC</span>","INR 1.6(2) PLT 62(2) SOFA4=5(2) → SIC <span class='wh'>6</span> → <span class='er'>SIC +</span>"],
code:`"""ISTH overt DIC (Taylor, Thromb Haemost 2001) + Sepsis-induced coagulopathy (Iba, BMJ Open 2017)."""

DDIMER = {"none": 0, "moderate": 2, "strong": 3}     # lab-specific cut-offs

def isth_overt_dic(plt, ddimer_level: str, pt_prolong_s, fib_g_l) -> tuple[int, bool]:
    s = 0 if plt >= 100 else 1 if plt >= 50 else 2
    s += DDIMER[ddimer_level]
    s += 0 if pt_prolong_s < 3 else 1 if pt_prolong_s < 6 else 2
    s += 1 if fib_g_l < 1.0 else 0
    return s, s >= 5

def sic_score(inr: float, plt: float, sofa4: int) -> tuple[int, bool]:
    """sofa4 = resp + cardiovascular + hepatic + renal SOFA (capped at 2 points)"""
    coag = (0 if inr <= 1.2 else 1 if inr <= 1.4 else 2) + (0 if plt >= 150 else 1 if plt >= 100 else 2)
    s = coag + min(sofa4, 2)
    return s, s >= 4 and coag > 2

def two_step(inr, plt, sofa4, ddimer_level, pt_prolong_s, fib_g_l) -> str:
    sic, sic_pos = sic_score(inr, plt, sofa4)
    if not sic_pos:
        return f"SIC {sic} - negative, repeat daily"
    isth, overt = isth_overt_dic(plt, ddimer_level, pt_prolong_s, fib_g_l)
    return f"SIC {sic} + ISTH {isth} -> {'OVERT DIC' if overt else 'SIC (non-overt)'}"`},

{id:"padua",title:"Padua VTE 风险评分（内科患者）",

notes:["ICU 患者几乎都 ≥4 分 → 关键在于评估出血风险","高出血风险：机械预防（IPC）；ICU 不推荐单用弹力袜","CrCl <30 mL/min：UFH 优先或依诺肝素减量"],
refs:"Barbar S, J Thromb Haemost 2010 · Schünemann HJ, Blood Adv 2018 (ASH VTE prophylaxis)",

code:`"""Padua Prediction Score for VTE in medical inpatients (Barbar, J Thromb Haemost 2010)."""

PADUA = {
    "active_cancer": 3, "previous_vte": 3, "reduced_mobility": 3, "thrombophilia": 3,
    "recent_trauma_or_surgery_1m": 2,
    "age_ge_70": 1, "heart_or_resp_failure": 1, "acute_mi_or_ischemic_stroke": 1,
    "acute_infection_or_rheum": 1, "obesity_bmi_ge_30": 1, "hormonal_treatment": 1,
}

def padua(**flags: bool) -> tuple[int, str]:
    s = sum(PADUA[k] for k, v in flags.items() if v)
    return s, "HIGH" if s >= 4 else "low"

def prophylaxis(score: int, bleeding_high: bool, crcl_ml_min: float) -> str:
    if score < 4:
        return "early mobilisation, no pharmacologic prophylaxis"
    if bleeding_high:
        return "IPC (mechanical) until bleeding risk falls"
    if crcl_ml_min < 30:
        return "UFH 5000 U SC q8-12h"
    return "enoxaparin 40 mg SC qd"`},

desc:"6 个条目，总分 6–23；分数越低风险越高。",

["移动","完全不能","非常受限","轻度受限","不受限"],["营养","非常差","可能不足","充足","良好"],["摩擦力/剪切力","有问题","潜在问题","无明显问题","—"]]},

code:`"""Braden Scale for pressure-injury risk (Bergstrom, Nurs Res 1987). Lower = higher risk."""

BRADEN = {
    "sensory_perception": (1, 4), "moisture": (1, 4), "activity": (1, 4),
    "mobility": (1, 4), "nutrition": (1, 4), "friction_shear": (1, 3),
}

def braden(**items: int) -> tuple[int, str]:
    assert set(items) == set(BRADEN), "all six items required"
    for k, v in items.items():
        lo, hi = BRADEN[k]
        assert lo <= v <= hi, f"{k} out of range"
    s = sum(items.values())
    band = ("very high" if s <= 9 else "high" if s <= 12 else "moderate" if s <= 14
            else "mild" if s <= 18 else "no risk")
    return s, band

def turning_interval_h(band: str) -> int:
    return {"very high": 2, "high": 2, "moderate": 3, "mild": 4}.get(band, 4)`},

notes:["ESPEN 2019：早期（第 1–3 天）低热卡 <70% 能量消耗，3 天后逐步达 80–100%","蛋白质逐步达 1.3 g/kg/d；优先间接测热法","无禁忌时 48 h 内开始早期肠内营养"],
refs:"Heyland DK, Crit Care 2011 · Rahman A, Clin Nutr 2016 · Singer P, Clin Nutr 2019 (ESPEN ICU)",

demo:["age 68(1) APACHE 21(2) SOFA 9(1) comorbid 3(1) days 2(1) → mNUTRIC <span class='wh'>6</span> → <span class='er'>HIGH</span>","energy_target(70 kg, day 1) → trophic / &lt;70% EE (~875 kcal)"],
code:`"""(m)NUTRIC - nutrition risk in the critically ill (Heyland 2011; Rahman, Clin Nutr 2016)."""

def nutric(age, apache2, sofa, n_comorbid, days_hosp_to_icu, il6=None) -> tuple[int, bool]:
    s = 0 if age < 50 else 1 if age < 75 else 2
    s += 0 if apache2 < 15 else 1 if apache2 < 20 else 2 if apache2 < 28 else 3
    s += 0 if sofa < 6 else 1 if sofa < 10 else 2
    s += 1 if n_comorbid >= 2 else 0
    s += 1 if days_hosp_to_icu >= 1 else 0
    if il6 is None:                        # modified NUTRIC, 0-9
        return s, s >= 5
    s += 1 if il6 >= 400 else 0            # full NUTRIC, 0-10
    return s, s >= 6

def energy_target(weight_kg: float, icu_day: int) -> str:
    """ESPEN 2019: hypocaloric (<70% EE) early, 80-100% after day 3"""
    kcal = 25 * weight_kg
    if icu_day <= 3:
        return f"trophic / <70% EE (~{round(0.5 * kcal)} kcal)"
    return f"80-100% EE (~{round(0.9 * kcal)} kcal), protein 1.3 g/kg/d"`},

code:`"""Severe CAP: CURB-65 (Lim, Thorax 2003) + ATS/IDSA criteria (Metlay, AJRCCM 2019)."""

def curb65(confusion: bool, urea_mmol: float, rr: int, sbp: int, dbp: int, age: int):
    s = confusion + (urea_mmol > 7) + (rr >= 30) + (sbp < 90 or dbp <= 60) + (age >= 65)
    if s <= 1:
        return s, "low - consider outpatient"
    return s, "moderate - admit" if s == 2 else "severe - consider ICU if 4-5"

MINOR = ["rr_ge_30", "pf_le_250", "multilobar", "confusion", "bun_ge_20mgdl",
         "wbc_lt_4", "plt_lt_100", "temp_lt_36", "hypotension_needs_fluids"]

def ats_idsa_severe(septic_shock_on_pressors: bool, mech_vent: bool, **minor: bool) -> bool:
    if septic_shock_on_pressors or mech_vent:      # any major criterion
        return True
    return sum(bool(minor.get(k)) for k in MINOR) >= 3`},

code:`"""Acute pancreatitis: BISAP (Wu, Gut 2008) + modified Marshall + Revised Atlanta (Banks, Gut 2013)."""

def bisap(bun_mgdl, impaired_mental: bool, sirs_count: int, age: int, pleural_effusion: bool) -> int:
    return (bun_mgdl > 25) + impaired_mental + (sirs_count >= 2) + (age > 60) + pleural_effusion

def modified_marshall(pf, cr_umol, sbp, fluid_responsive=True, ph=None) -> dict:
    resp = 4 if pf <= 101 else 3 if pf <= 200 else 2 if pf <= 300 else 1 if pf <= 400 else 0
    renal = 0 if cr_umol < 134 else 1 if cr_umol < 170 else 2 if cr_umol <= 310 else 3 if cr_umol <= 439 else 4
    cv = 0 if sbp >= 90 else 1 if fluid_responsive else 2
    if sbp < 90 and ph is not None and ph < 7.3:
        cv = 4 if ph < 7.2 else 3
    return {"resp": resp, "renal": renal, "cv": cv}

def organ_failure(m: dict) -> bool:
    return any(v >= 2 for v in m.values())

def atlanta(organ_failure_hours: float, local_complication: bool) -> str:
    if organ_failure_hours > 48:
        return "SEVERE (persistent organ failure)"
    if organ_failure_hours > 0 or local_complication:
        return "MODERATELY SEVERE"
    return "MILD"`},

code:`"""aSAH grading: Hunt-Hess (1968), WFNS (1988), modified Fisher (Frontera, Neurosurgery 2006)."""

HUNT_HESS = {
    1: "asymptomatic or mild headache, slight nuchal rigidity",
    2: "moderate-severe headache, nuchal rigidity, no deficit other than CN palsy",
    3: "drowsy / confused, mild focal deficit",
    4: "stupor, moderate-severe hemiparesis, early decerebrate posturing",
    5: "deep coma, decerebrate rigidity, moribund",

def wfns(gcs: int, motor_deficit: bool) -> int:
    if gcs == 15:
        return 1
    if gcs >= 13:
        return 3 if motor_deficit else 2
    return 4 if gcs >= 7 else 5

def modified_fisher(sah: str, ivh: bool) -> int:
    """sah: 'none' | 'thin' | 'thick'"""
    if sah == "none":
        return 0
    return (1 if sah == "thin" else 3) + int(ivh)

code:`"""Upper GI bleeding: Glasgow-Blatchford (Blatchford, Lancet 2000) + Forrest classification."""

def gbs(bun_mmol, hb_g_dl, male: bool, sbp, hr, melena, syncope, hepatic_dz, cardiac_failure) -> int:
    s = 0 if bun_mmol < 6.5 else 2 if bun_mmol < 8 else 3 if bun_mmol < 10 else 4 if bun_mmol < 25 else 6
    if male:
        s += 0 if hb_g_dl >= 13 else 1 if hb_g_dl >= 12 else 3 if hb_g_dl >= 10 else 6
    else:
        s += 0 if hb_g_dl >= 12 else 1 if hb_g_dl >= 10 else 6
    s += 0 if sbp >= 110 else 1 if sbp >= 100 else 2 if sbp >= 90 else 3
    s += (hr >= 100) + melena + 2 * syncope + 2 * hepatic_dz + 2 * cardiac_failure
    return s

FORREST = {
    "Ia": "spurting arterial bleeding",
    "Ib": "oozing bleeding",
    "IIa": "non-bleeding visible vessel",
    "IIb": "adherent clot",
    "IIc": "flat pigmented spot",
    "III": "clean ulcer base",
}
HIGH_RISK = {"Ia", "Ib", "IIa"}        # endoscopic therapy; IIb: consider clot removal

def very_low_risk(score: int) -> bool:
    return score <= 1`},

code:`"""Cardiogenic shock: Killip (1967) + SCAI SHOCK stages (Naidu, JACC 2022)."""

KILLIP = {
    1: "no clinical signs of heart failure",
    2: "rales, S3, raised JVP",
    3: "frank acute pulmonary oedema",
    4: "cardiogenic shock (SBP < 90 + hypoperfusion)",
}

SCAI = {
    "A": "At risk - no hypotension / hypoperfusion",
    "B": "Beginning - hypotension or tachycardia WITHOUT hypoperfusion",
    "C": "Classic - hypoperfusion requiring vasoactive / MCS",
    "D": "Deteriorating - failing initial interventions",
    "E": "Extremis - refractory shock, ongoing CPR or ECMO",
}

def scai_stage(sbp, lactate, n_vasoactive: int, on_mcs: bool, worsening: bool, arrest: bool) -> str:
    if arrest:
        return "E"
    hypoperfusion = lactate >= 2.0
    if worsening and (n_vasoactive >= 2 or on_mcs):
        return "D"
    if hypoperfusion and (n_vasoactive or on_mcs):
        return "C"
    if sbp < 90 or n_vasoactive:
        return "C" if hypoperfusion else "B"
    return "A"

def cardiac_power_output(map_mmhg: float, co_l_min: float) -> float:
    return map_mmhg * co_l_min / 451      # watts; < 0.6 W = poor prognosis`},

code:`"""MRC sum score for ICU-acquired weakness (De Jonghe, JAMA 2002). 6 groups x 2 sides, 0-5 each."""

GROUPS = ["shoulder abduction", "elbow flexion", "wrist extension",
          "hip flexion", "knee extension", "ankle dorsiflexion"]

MRC_GRADE = {0: "no contraction", 1: "flicker", 2: "movement with gravity eliminated",
             3: "against gravity", 4: "against some resistance", 5: "normal power"}

def eligible(rass: int, s5q_correct: int) -> bool:
    """awake and cooperative: RASS 0~+1 and >= 3/5 standardized commands"""
    return 0 <= rass <= 1 and s5q_correct >= 3

def mrc_sum(left: list[int], right: list[int]) -> tuple[int, str]:
    assert len(left) == len(right) == len(GROUPS)
    assert all(0 <= x <= 5 for x in left + right)
    s = sum(left) + sum(right)
    if s < 36:
        return s, "severe ICU-AW"
    return s, "ICU-AW" if s < 48 else "no ICU-AW"`}

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- syntax highlight (Dark+) ---------- */
const KW1=new Set("def class lambda None True False self const let var function interface export type null undefined true false number string boolean Record".split(" "));
const KW2=new Set("import from as return if elif else for in while with try except raise yield async await and or not is pass break continue assert".split(" "));
function hl(s,lang){const cm=lang==="py"?"#.*$":"\\/\\/.*$";
  const re=new RegExp(`(${cm})|("""[^"]*(?:"""|$)|[bf]?"(?:[^"\\\\]|\\\\.)*"?|'(?:[^'\\\\]|\\\\.)*'?)|\\b([A-Za-z_]\\w*)\\b(?=\\s*\\()|\\b([A-Za-z_]\\w*)\\b|\\b(\\d+(?:\\.\\d+)?(?:e-?\\d+)?)\\b`,"g");
  let o="",last=0,m;
  while((m=re.exec(s))){if(m[0]===""){re.lastIndex++;continue;}o+=esc(s.slice(last,m.index));last=re.lastIndex;
    if(m[1])o+=`<span class="c">${esc(m[1])}</span>`;else if(m[2])o+=`<span class="s">${esc(m[2])}</span>`;
    else if(m[3]){const w=m[3];o+=KW2.has(w)?`<span class="k2">${w}</span>`:KW1.has(w)?`<span class="k">${w}</span>`:`<span class="f">${w}</span>`;}
    else if(m[4]){const w=m[4];o+=KW2.has(w)?`<span class="k2">${w}</span>`:KW1.has(w)?`<span class="k">${w}</span>`:/^[A-Z][a-z]/.test(w)?`<span class="cl">${w}</span>`:`<span class="v">${w}</span>`;}
    else if(m[5])o+=`<span class="u">${m[5]}</span>`;}
  return o+esc(s.slice(last));}

/* ---------- explorer ---------- */
const ICON={py:["Py","#4b8bbe"],ts:["TS","#3178c6"],sql:["DB","#d19a66"],yaml:["!","#cb4b16"],md:["M↓","#519aba"],toml:["⚙","#9c9c9c"],gitignore:["◆","#41535b"]};
const TREE=[["d",0,".github"],["d",0,".vscode"],["d",0,"configs"],["d",0,"docs/scores"],["d",0,"notebooks"],["d",0,"sql"],["D",0,"src/icu_core"],
  ["d",1,"cds"],["d",1,"imaging"],["d",1,"ingest"],["d",1,"models"],["d",1,"pipeline"],["D",1,"scores"]];
SCORES.filter(s=>s.lang==="py").forEach(s=>TREE.push(["f",2,s.name]));
TREE.push(["d",0,"tests"],["D",0,"web/src/scores"]);SCORES.filter(s=>s.lang==="ts").forEach(s=>TREE.push(["f",1,s.name]));
TREE.push(["f",0,".gitignore"],["f",0,"pyproject.toml"],["f",0,"README.md"]);
const treeEl=$("#tree"),fileRow={};
TREE.forEach(([t,lv,name])=>{const d=document.createElement("div");d.className="tr"+(t==="f"?" f":"");d.style.paddingLeft=(8+lv*12)+"px";
  if(t!=="f")d.innerHTML=`<span class="ar">${t==="D"?"▾":"▸"}</span><span class="nm">${name}</span>`;
  else{const ext=name.split(".").pop(),ic=ICON[ext]||["·","#999"];d.innerHTML=`<span class="ar"></span><span class="ic" style="color:${ic[1]}">${ic[0]}</span><span class="nm">${name}</span><span class="gm"></span>`;fileRow[name]=d;
    const idx=SCORES.findIndex(s=>s.name===name);if(idx>=0)d.addEventListener("click",()=>jump(idx));}
  treeEl.appendChild(d);});

/* ---------- preview ---------- */
const pv=$("#pv");
function renderPreview(S){
  $("#pvtab").innerHTML=`<span style="color:#519aba;font:700 9px Consolas">M↓</span>Preview ${S.id}.md<span class="x">✕</span>`;
  $("#pvcrumb").innerHTML=`docs <span style="opacity:.6">›</span> scores <span style="opacity:.6">›</span> ${S.id}.md`;
  let h=`<h1>${S.title}</h1><p class="d">${S.desc}</p>`;
  S.tables.forEach(t=>{h+=`<h3>${t.cap}</h3><table><tr>${t.head.map(x=>`<th>${x}</th>`).join("")}</tr>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;});
  if(S.notes)h+=`<h3>要点</h3><ul>${S.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`;
  h+=`<div class="ref">References: ${S.refs}</div>`;pv.innerHTML=h;pv.scrollTop=0;pvManual=false;}
let pvManual=false;
function syncPreview(p){if(pvManual)return;const max=pv.scrollHeight-pv.clientHeight;if(max>0)pv.scrollTop=Math.round(max*Math.min(1,Math.max(0,(p-.15)/.75)));}

/* ---------- editor ---------- */
const ed=$("#ed"),term=$("#term");let curS=null,lines=[],curLineEl=null,openTabs=[];
function openFile(S){curS=S;if(!openTabs.includes(S))openTabs.push(S);if(openTabs.length>4)openTabs.shift();
  $("#tabs").innerHTML=openTabs.map(o=>{const ic=ICON[o.lang];return `<div class="tab${o===S?" on":""}"><span style="color:${ic[1]};font:700 9px Consolas">${ic[0]}</span>${o.name}<span class="x">${o===S?"●":"✕"}</span></div>`;}).join("");
  $("#crumb").innerHTML=S.path.split("/").map(esc).join(' <span style="opacity:.6">›</span> ');
  document.querySelectorAll(".tr.on").forEach(e=>e.classList.remove("on"));const row=fileRow[S.name];row.classList.add("on","mod");row.querySelector(".gm").textContent="M";
  const tt=row.offsetTop-treeEl.clientHeight/2;treeEl.scrollTop=Math.max(0,tt);
  $("#wtitle").textContent=`● ${S.name} — cip-clinical-ml`;document.title=`${S.name} — cip-clinical-ml — Visual Studio Code`;
  $("#lang").textContent=S.lang==="py"?"Python":"TypeScript";$("#interp").style.display=S.lang==="py"?"":"none";
  $("#prog").textContent=`◷ scores ${SCORES.indexOf(S)+1}/${SCORES.length}`;
  ed.innerHTML="";lines=[];renderPreview(S);drawMM();try{localStorage.setItem("cip.idx",SCORES.indexOf(S))}catch(e){}}
function newLine(){if(curLineEl)curLineEl.classList.remove("cur");const d=document.createElement("div");d.className="l cur";
  d.innerHTML=`<span class="n">${lines.length+1}</span><span class="x"></span>`;ed.appendChild(d);lines.push("");curLineEl=d;
  ed.scrollTop=Math.max(0,d.offsetTop-ed.clientHeight*.55);drawMM();}
function setLine(txt,cursor){lines[lines.length-1]=txt;curLineEl.lastChild.innerHTML=hl(txt,curS.lang)+(cursor?'<span class="cr"></span>':"");
  $("#pos").textContent=`Ln ${lines.length}, Col ${txt.length+1}`;}
const MM={c:$("#mmc")};
function fitMM(){const r=MM.c.getBoundingClientRect(),d=devicePixelRatio||1;MM.c.width=r.width*d;MM.c.height=r.height*d;MM.ctx=MM.c.getContext("2d");MM.ctx.setTransform(d,0,0,d,0,0);MM.w=r.width;MM.h=r.height;}
function drawMM(){if(!MM.ctx)return;const c=MM.ctx;c.clearRect(0,0,MM.w,MM.h);
  lines.forEach((t,i)=>{const ind=t.length-t.trimStart().length,cm=/^\s*(#|\/\/|""")/.test(t);c.fillStyle=cm?"rgba(106,153,85,.6)":"rgba(156,220,254,.38)";c.fillRect(5+ind*.9,4+i*3,Math.min(t.trim().length*.9,MM.w-8),2);});
  c.fillStyle="rgba(121,121,121,.18)";c.fillRect(0,4+ed.scrollTop/19*3,MM.w,ed.clientHeight/19*3);}

/* ---------- terminal ---------- */
function tl(html){const d=document.createElement("div");d.className="t";d.innerHTML=html;term.appendChild(d);while(term.childElementCount>400)term.firstChild.remove();term.scrollTop=term.scrollHeight;return d;}
const PROMPT=()=>`<span class="ok">clin@cip-gpu02</span>:<span class="bl">~/cip-clinical-ml</span><span class="wh">(feature/icu-scores)</span>$ `;

/* ---------- generators (yield = delay ms) ---------- */
function* typeCode(S){openFile(S);yield 600;const src=S.code.split("\n");
  for(let li=0;li<src.length;li++){const line=src[li];newLine();const ind=line.match(/^\s*/)[0];let cur=ind;setLine(cur,true);yield rnd(40,120);
    for(let k=ind.length;k<line.length;k++){
      if(Math.random()<.012&&/[a-z]/.test(line[k])){setLine(cur+String.fromCharCode(97+ri(0,25)),true);yield rnd(90,180);setLine(cur,true);yield rnd(80,150);}
      cur+=line[k];setLine(cur,true);yield line[k]===" "&&Math.random()<.05?rnd(250,700):rnd(18,65);}
    setLine(line,false);syncPreview((li+1)/src.length);yield rnd(60,240);if(Math.random()<.05)yield rnd(800,2000);}
  setLine(lines[lines.length-1],true);$("#wtitle").textContent=`${S.name} — cip-clinical-ml`;const x=document.querySelector(".tab.on .x");if(x)x.textContent="✕";yield 900;}
function* cmd(t){const d=tl(PROMPT()+"<span></span>");const s=d.lastChild;yield 500;for(let k=1;k<=t.length;k++){s.textContent=t.slice(0,k);yield rnd(25,85);}yield 400;}
function* out(arr,lo=30,hi=160){for(const a of arr){tl(a);yield rnd(lo,hi);}}
function* runFor(S){
  if(S.lang==="py"){yield* cmd(`pytest tests/scores/test_${S.id}.py -q`);
    yield* out([`<span class="wh">============================= test session starts ==============================</span>`,`platform linux -- Python 3.12.4, pytest-8.3.2, pluggy-1.5.0`,`rootdir: /home/clin/cip-clinical-ml  configfile: pyproject.toml`,`collected ${S.tests.length} items`,""],20,60);
    S.tests.forEach((t,i)=>{});for(let i=0;i<S.tests.length;i++){const t=S.tests[i];tl(`tests/scores/test_${S.id}.py::${t} <span class="ok">PASSED</span>${" ".repeat(Math.max(1,56-t.length-S.id.length))}<span class="ok">[${String(Math.round(100*(i+1)/S.tests.length)).padStart(3)}%]</span>`);yield rnd(80,320);}
    tl(`<span class="ok">============================== ${S.tests.length} passed in ${rnd(.3,1.6).toFixed(2)}s ===============================</span>`);yield 600;
    yield* cmd(`python -m icu_core.scores.${S.id} --demo`);}
  else{yield* cmd(`cd web && npx vitest run ${S.id} --reporter=verbose`);yield* out([""," <span class='cy'>RUN</span>  v2.1.1 /home/clin/cip-clinical-ml/web",""],30,80);
    for(const t of S.tests){tl(` <span class="ok">✓</span> src/scores/${S.id}.test.ts > ${t} <span class="dm">${ri(1,6)}ms</span>`);yield rnd(80,250);}
    yield* out([""," <span class='dm'>Test Files</span>  <span class='ok'>1 passed</span> (1)",`      <span class='dm'>Tests</span>  <span class='ok'>${S.tests.length} passed</span> (${S.tests.length})`],30,80);yield 500;
    yield* cmd(`npx tsx src/scores/${S.id}.ts --demo && cd ..`);}
  yield* out(S.demo,200,600);yield 900;}
function* gitCommit(S){const m=`feat(scores): ${S.id} calculator + reference table`;yield* cmd(`git add ${S.path} docs/scores/${S.id}.md tests/ && git commit -qm "${m}"`);
  tl(`[feature/icu-scores ${Math.random().toString(16).slice(2,9)}] ${m}`);tl(` 3 files changed, ${S.code.split("\n").length+ri(20,60)} insertions(+), ${ri(0,12)} deletions(-)`);
  fileRow[S.name].classList.remove("mod");fileRow[S.name].querySelector(".gm").textContent="";yield 800;}
function* main(start){let i=start;
  if(start===0){yield* cmd("git pull --rebase");yield* out(["Current branch feature/icu-scores is up to date."]);}
  while(true){const S=SCORES[((i%SCORES.length)+SCORES.length)%SCORES.length];curIdx=SCORES.indexOf(S);i++;
    yield* typeCode(S);yield* runFor(S);if(Math.random()<.6)yield* gitCommit(S);yield 1500;}}

let saved=0;try{saved=(+localStorage.getItem("cip.idx")||0)%SCORES.length}catch(e){}
let curIdx=saved,G=main(saved),boost=0,paused=false,timer=null;
function tick(){if(paused){timer=setTimeout(tick,200);return;}let d=0,g=0;
  while(d<=0&&g++<80){d=G.next().value||0;if(boost>0&&d<300){boost--;d=0;}}timer=setTimeout(tick,d);}
function jump(i){clearTimeout(timer);G=main(((i%SCORES.length)+SCORES.length)%SCORES.length);boost=0;tl("^C");tick();}
/* ---------- layout: drag split / Ctrl+B sidebar / F4 wide preview ---------- */
const mainc=$("#mainc"),vsash=$("#vsash"),appEl=$("#app");
function setLW(px){const w=mainc.clientWidth;px=Math.max(w*.22,Math.min(w*.72,px));mainc.style.setProperty("--lw",px+"px");fitMM();drawMM();return px/w;}
let lwRatio=null;try{lwRatio=parseFloat(localStorage.getItem("cip.lw"))||null}catch(e){}
function applyLW(){if(lwRatio)setLW(lwRatio*mainc.clientWidth);else{mainc.style.removeProperty("--lw");fitMM();drawMM();}}
vsash.addEventListener("mousedown",e=>{e.preventDefault();vsash.classList.add("drag");const x0=mainc.getBoundingClientRect().left;
  const mv=ev=>{lwRatio=setLW(ev.clientX-x0);};const up=()=>{vsash.classList.remove("drag");document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);try{localStorage.setItem("cip.lw",lwRatio)}catch(e){}};
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);});
vsash.addEventListener("dblclick",e=>{e.stopPropagation();lwRatio=null;try{localStorage.removeItem("cip.lw")}catch(e){}applyLW();});
let wide=false;
function toggleWide(){wide=!wide;if(wide)setLW(mainc.clientWidth*.28);else applyLW();}
function toggleSidebar(){appEl.classList.toggle("nosb");try{localStorage.setItem("cip.nosb",appEl.classList.contains("nosb")?"1":"0")}catch(e){}requestAnimationFrame(()=>{wide?setLW(mainc.clientWidth*.28):applyLW();});}
try{if(localStorage.getItem("cip.nosb")==="1")appEl.classList.add("nosb")}catch(e){}
applyLW();
/* ---------- review (cloze) mode ---------- */
let cloze=false;try{cloze=localStorage.getItem("cip.cloze")==="1"}catch(e){}
function setCloze(v){cloze=v;pv.classList.toggle("cloze",v);$("#revbtn").textContent=v?"◉ Review: on":"◎ Review: off";try{localStorage.setItem("cip.cloze",v?"1":"0")}catch(e){}}
pv.addEventListener("click",e=>{const td=e.target.closest("td");if(td&&cloze)td.classList.toggle("rev");});
$("#revbtn").addEventListener("click",()=>setCloze(!cloze));setCloze(cloze);
/* ---------- quick open (Ctrl+P) ---------- */
const qo=$("#qo"),qi=$("#qi"),ql=$("#ql");let qsel=0,qitems=[];
function qoOpen(){qo.style.display="block";qi.value="";qoFilter();qi.focus();}
function qoClose(){qo.style.display="none";qi.blur();}
function qoFilter(){const q=qi.value.trim().toLowerCase();qitems=SCORES.map((s,i)=>({s,i})).filter(({s})=>!q||(s.name+" "+s.id+" "+s.title).toLowerCase().includes(q)).slice(0,14);qsel=0;renderQ();}
function renderQ(){ql.innerHTML=qitems.map((o,k)=>`<div class="it${k===qsel?" on":""}" data-i="${o.i}"><span style="color:${ICON[o.s.lang][1]};font:700 9px Consolas;align-self:center">${ICON[o.s.lang][0]}</span><span>${o.s.name}</span><span class="p">${o.s.title}</span></div>`).join("");}
qi.addEventListener("input",qoFilter);
ql.addEventListener("mousedown",e=>{const it=e.target.closest(".it");if(it){e.preventDefault();qoClose();jump(+it.dataset.i);}});
document.addEventListener("keydown",e=>{
  if(qo.style.display==="block"){
    if(e.key==="Escape"){e.preventDefault();qoClose();}
    else if(e.key==="ArrowDown"){e.preventDefault();qsel=Math.min(qsel+1,qitems.length-1);renderQ();}
    else if(e.key==="ArrowUp"){e.preventDefault();qsel=Math.max(qsel-1,0);renderQ();}
    else if(e.key==="Enter"){e.preventDefault();const o=qitems[qsel];qoClose();if(o)jump(o.i);}
    return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="p"||e.key==="P")){e.preventDefault();qoOpen();return;}
  if(e.key==="F2"){e.preventDefault();setCloze(!cloze);return;}
  if(e.key==="F4"){e.preventDefault();toggleWide();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="b"||e.key==="B")){e.preventDefault();toggleSidebar();return;}
  if(e.key==="Pause"){paused=!paused;return;}
  if(e.key==="ArrowRight"){e.preventDefault();jump(curIdx+1);return;}
  if(e.key==="ArrowLeft"){e.preventDefault();jump(curIdx-1);return;}
  if(e.key==="ArrowDown"){e.preventDefault();pvManual=true;pv.scrollTop+=60;return;}
  if(e.key==="ArrowUp"){e.preventDefault();pvManual=true;pv.scrollTop-=60;return;}
  if(["F11","F12","Escape"].includes(e.key)||e.ctrlKey||e.altKey||e.metaKey)return;
  e.preventDefault();boost+=ri(3,6);});
pv.addEventListener("wheel",e=>{pvManual=true;pv.scrollTop+=e.deltaY;},{passive:true});
document.addEventListener("dblclick",()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});});
window.addEventListener("resize",()=>{wide?setLW(mainc.clientWidth*.28):applyLW();});
fitMM();tick();
</script>
</body>
</html>
